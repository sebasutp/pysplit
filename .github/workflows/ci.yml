name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./data/ci/pysplit.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: PYTHONPATH=. pytest -n auto
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test and coverage
        run: npm run test:coverage
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    env:
      # The suite uses the development-only mock login and the same online
      # feature flags as ./dev. Never enable these in production.
      ENVIRONMENT: development
      ENABLE_MOCK_LOGIN: 'true'
      BASE_URL: http://127.0.0.1:5173
      DATABASE_URL: sqlite:///./data/ci/e2e.db
      UPLOAD_DIR: ./data/ci/uploads
      VITE_API_PROXY_TARGET: http://127.0.0.1:8000
      AUTH_RATE_LIMIT_PER_MINUTE: '1000'
      AUTH_ACCOUNT_RATE_LIMIT_PER_MINUTE: '1000'
      ENABLE_RECEIPT_EXTRACT: 'true'
      ENABLE_RECEIPT_ITEMS: 'true'
      ENABLE_CATEGORY_EXTRACT: 'true'
      ENABLE_EXPENSE_DOCUMENTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Migrate database
        working-directory: backend
        run: alembic upgrade head
      - name: Run Playwright tests
        working-directory: frontend
        run: |
          set -euo pipefail
          (cd ../backend && PYTHONPATH=. python -m uvicorn app.main:app --host 127.0.0.1 --port 8000) &
          API_PID=$!
          ./node_modules/.bin/vite &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1 &&
               curl -fsS "$BASE_URL" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS "$BASE_URL" >/dev/null

          npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checker dependency
        run: pip install pyyaml==6.0.3
      - name: Check parity matrix
        run: python scripts/check_parity_matrix.py
      - name: Check architecture
        run: python scripts/check_architecture.py
