# Production web tier: static SPA + same-origin /api proxy.
#
# TLS terminates at the edge (Caddy, Traefik, a cloud load balancer). Do not
# expose this container directly to the internet without HTTPS.
#
# The runtime image is nginx-unprivileged and cannot bind port 80. Inside the
# container it listens on 8080; the host/proxy maps that to 80/443 as needed.

upstream pysplit_api {
    server api:8000;
    keepalive 16;
}

server {
    # IPv4 only. The image entrypoint normally adds `listen [::]:8080` when the
    # host has IPv6, but it cannot edit this file on the read-only root
    # filesystem used in production. Shipping an unconditional IPv6 listen
    # would instead make nginx fail to start on hosts with IPv6 disabled.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Receipt/document uploads; keep in step with MAX_UPLOAD_BYTES plus form
    # and multipart overhead.
    client_max_body_size 12m;

    # Do not advertise the exact nginx version.
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    include /etc/nginx/snippets/pysplit-security-headers.conf;

    # Container health probe; never cached or logged.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/pysplit-security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API traffic is always dynamic. It must never be cached by nginx or a
    # service worker, and the browser must not reuse a stale response.
    # ``^~`` makes this prefix match win over the static-file regex below.
    location ^~ /api/ {
        proxy_pass http://pysplit_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, do not append: the backend takes the left-most address
        # when TRUST_FORWARDED_HEADERS=true. If an edge proxy sits in front of
        # nginx, configure real_ip (set_real_ip_from / real_ip_header) so
        # $remote_addr is the client rather than the edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        include /etc/nginx/snippets/pysplit-security-headers.conf;
        add_header Cache-Control "no-store" always;
        # Streaming uploads should not be buffered in full by nginx.
        proxy_request_buffering off;
    }

    # The service worker, build contract and manifest control updates. A stale
    # copy here would pin clients to an old release.
    location = /sw.js {
        include /etc/nginx/snippets/pysplit-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/pysplit-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /pwa-build.json {
        include /etc/nginx/snippets/pysplit-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Vite emits content-hashed assets; they can be cached forever.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/snippets/pysplit-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Static images, icons and fonts. Receipt images live under /api and are
    # handled by the proxy above, never by this location.
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|ico|svg|woff2?|ttf|otf)$ {
        try_files $uri =404;
        expires 30d;
        include /etc/nginx/snippets/pysplit-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # SPA deep links (/groups/:id/...) must return index.html. API paths are
    # matched earlier and never fall through here.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/pysplit-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Unknown static files should be a normal 404, not the SPA shell.
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        try_files $uri =404;
        expires 30d;
    }
}
