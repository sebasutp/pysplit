# Production web tier: static SPA + same-origin /api proxy.
#
# TLS terminates at the edge (Caddy, Traefik, a cloud load balancer). Do not
# expose this container directly to the internet without HTTPS.

upstream pysplit_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Receipt/document uploads; keep in step with MAX_UPLOAD_BYTES plus form
    # and multipart overhead.
    client_max_body_size 12m;

    # Do not advertise the exact nginx version.
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Container health probe; never cached or logged.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API traffic is always dynamic. It must never be cached by nginx or a
    # service worker, and the browser must not reuse a stale response.
    location /api/ {
        proxy_pass http://pysplit_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store" always;
        # Streaming uploads should not be buffered in full by nginx.
        proxy_request_buffering off;
    }

    # The service worker, build contract and manifest control updates. A stale
    # copy here would pin clients to an old release.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /pwa-build.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Vite emits content-hashed assets; they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Static images, icons and fonts. Receipt images live under /api and are
    # handled by the proxy above, never by this location.
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|ico|svg|woff2?|ttf|otf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # SPA deep links (/groups/:id/...) must return index.html. API paths are
    # matched earlier and never fall through here.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Unknown static files should be a normal 404, not the SPA shell.
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        try_files $uri =404;
        expires 30d;
    }
}
